name: IPC data watch

# Monthly maintenance for the vintage-pinned series.
#  - INDEC published a month newer than config.DATA_VINTAGE -> bump the pin, rebuild the artifact
#    (`make data`) and run the web tests against it. When both pass, the bump is pushed straight
#    to master with the `ipc-watch` deploy key (a bypass actor of the `protect-master` ruleset):
#    that push runs the usual checks and deploys the site like any other commit. When either
#    fails — a bump that completes a calendar year needs that year's Dec–Dec anchor in
#    config.INDEC_NACIONAL_ANNUAL (validate.missing_anchor_years), which a human adds; a fetch
#    error; a web test pinned to the old vintage — the bump goes to a draft PR with the outcome
#    in its body.
#  - datos.gob.ar unreachable, or the current pin stops reproducing the anchors -> open a tracking issue.
# INDEC publishes the IPC of month M around the middle of month M+1; the 20th leaves a margin.
# Downstream: argentina-income-percentile polls the deployed series.v1.json on the 21st (cpi-sync).

on:
  schedule:
    - cron: "0 9 20 * *" # 09:00 UTC on the 20th of every month
  workflow_dispatch:

# The job token only opens PRs and issues. Every push (the bump on master, the fallback branch)
# goes through the deploy key, so it triggers the normal workflows (a job-token push would not).
permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ipc-data-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      # `ssh-key` switches the remote to SSH with the `ipc-watch` deploy key and keeps it for the
      # push steps below (persist-credentials stays on for this job on purpose).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.IPC_WATCH_DEPLOY_KEY }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Sync Python deps
        run: uv sync

      - name: Reproducibility check (current vintage vs the live sources)
        id: health
        continue-on-error: true
        run: make data

      - name: Watch for a newer IPC month
        id: watch
        env:
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          ISSUE_BODY_FILE: ipc-watch-body.md
        run: uv run python -m pipeline.watch

      # The green path also runs the web tests against the rebuilt artifact: a test pinned to a
      # vintage-dependent number must send the bump to a draft PR, never break master.
      - name: Set up Node (web tests)
        if: steps.watch.outputs.status == 'new_month'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        if: steps.watch.outputs.status == 'new_month'
        run: npm ci
        working-directory: web

      - name: Bump the vintage and rebuild the artifact (push to master, or a draft PR)
        if: steps.watch.outputs.status == 'new_month'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VINTAGE: ${{ steps.watch.outputs.next_vintage }}
          NEXT_LABEL: ${{ steps.watch.outputs.next_label }}
          PREV_VINTAGE: ${{ steps.watch.outputs.current_vintage }}
          PR_BODY_FILE: ipc-bump-pr-body.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          BRANCH="data/ipc-${NEXT_VINTAGE}"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')" ]; then
            echo "A draft PR for $BRANCH is already open (it needs a human) — skipping."
            exit 0
          fi
          # The health check above rewrote the artifact at the old vintage (new generated_at only):
          # start the bump from the committed copies.
          git checkout -- data/series.v1.json web/public/series.v1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run python -m pipeline.watch --apply
          # Rebuild at the new pin and run the web tests against it. A failure (a year-end crossed
          # without its anchor, a fetch error, a test pinned to the old vintage) still gets a PR, as
          # a draft, with the outcome in its body.
          if make data && make test-web; then DATA_OUTCOME=success; else DATA_OUTCOME=failure; fi
          git add pipeline/config.py data/series.v1.json web/public/series.v1.json
          git commit -m "data: bump vintage to ${NEXT_VINTAGE} (${NEXT_LABEL})" \
            -m "Applied by the IPC data watch: ${RUN_URL}"
          if [ "$DATA_OUTCOME" = success ]; then
            git push origin HEAD:master
            echo "Bumped ${PREV_VINTAGE} → ${NEXT_VINTAGE} on master; that push runs the checks and deploys."
            exit 0
          fi
          DATA_OUTCOME="$DATA_OUTCOME" uv run python -m pipeline.watch --pr-body
          git checkout -b "$BRANCH"
          git push --force -u origin "$BRANCH"
          gh pr create --draft \
            --title "data: bump vintage to ${NEXT_VINTAGE} (${NEXT_LABEL})" \
            --body-file "$PR_BODY_FILE"

      - name: Open tracking issue (source unreachable / reproducibility failure)
        if: steps.watch.outputs.needs_issue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.watch.outputs.issue_title }}
          BODY_FILE: ${{ steps.watch.outputs.issue_body_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          printf '\n[automated watch · run: %s]\n' "$RUN_URL" >> "$BODY_FILE"
          gh label create data-update --color FBCA04 \
            --description "Automated IPC data maintenance" 2>/dev/null || true
          EXISTING=$(gh issue list --state open --label data-update --limit 100 \
            --json number,title --jq '.[] | select(.title==env.TITLE) | .number' | head -n1 || true)
          if [ -n "${EXISTING:-}" ]; then
            echo "Tracking issue already open (#$EXISTING) — skipping."
          else
            gh issue create --title "$TITLE" --label data-update --body-file "$BODY_FILE"
          fi
